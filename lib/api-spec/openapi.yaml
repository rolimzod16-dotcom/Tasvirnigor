openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Tasvirnigor Film & Animation Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: projects
  - name: categories
  - name: team
  - name: content
  - name: partners
  - name: services
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all portfolio projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all project categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          description: Unauthorized

  /categories/{id}:
    patch:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all team members
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Create a team member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized

  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a team member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Delete a team member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /about:
    get:
      operationId: getAbout
      tags: [content]
      summary: Get about section content
      responses:
        "200":
          description: About content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"
    patch:
      operationId: updateAbout
      tags: [content]
      summary: Update about section (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"
        "401":
          description: Unauthorized

  /contacts:
    get:
      operationId: getContacts
      tags: [content]
      summary: Get contacts information
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contacts"
    patch:
      operationId: updateContacts
      tags: [content]
      summary: Update contacts (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contacts"
        "401":
          description: Unauthorized

  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List all services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      summary: Create a service (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized

  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      summary: Update a service (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteService
      tags: [services]
      summary: Delete a service (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List all partners
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partners]
      summary: Create a partner (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "401":
          description: Unauthorized

  /partners/{id}:
    patch:
      operationId: updatePartner
      tags: [partners]
      summary: Update a partner (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deletePartner
      tags: [partners]
      summary: Delete a partner (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "204":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check admin session status
      responses:
        "200":
          description: Admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not authenticated

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ProjectMediaItem:
      type: object
      required: [url, mimeType, name, sortOrder]
      properties:
        url:
          type: string
        mimeType:
          type: string
        name:
          type: string
        sortOrder:
          type: integer

    Project:
      type: object
      required: [id, title, isActive, sortOrder, createdAt, categories, mediaItems]
      properties:
        id:
          type: integer
        title:
          type: string
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
        mediaItems:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMediaItem"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    ProjectInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        mediaItems:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMediaItem"
        categoryIds:
          type: array
          items:
            type: integer

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        bannerUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        mediaItems:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMediaItem"
        categoryIds:
          type: array
          items:
            type: integer

    TeamMember:
      type: object
      required: [id, name, position, photoUrl, sortOrder, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
        positionRu:
          type: ["string", "null"]
        positionTj:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        bioRu:
          type: ["string", "null"]
        bioTj:
          type: ["string", "null"]
        photoUrl:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string

    TeamMemberInput:
      type: object
      required: [name, position, photoUrl]
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: string
          minLength: 1
        positionRu:
          type: ["string", "null"]
        positionTj:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        bioRu:
          type: ["string", "null"]
        bioTj:
          type: ["string", "null"]
        photoUrl:
          type: string
        sortOrder:
          type: integer

    TeamMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: string
          minLength: 1
        positionRu:
          type: ["string", "null"]
        positionTj:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        bioRu:
          type: ["string", "null"]
        bioTj:
          type: ["string", "null"]
        photoUrl:
          type: string
        sortOrder:
          type: integer

    About:
      type: object
      required: [id, headline, body]
      properties:
        id:
          type: integer
        headline:
          type: string
        headlineRu:
          type: ["string", "null"]
        headlineTj:
          type: ["string", "null"]
        body:
          type: string
        bodyRu:
          type: ["string", "null"]
        bodyTj:
          type: ["string", "null"]
        mission:
          type: ["string", "null"]
        missionRu:
          type: ["string", "null"]
        missionTj:
          type: ["string", "null"]
        founded:
          type: ["string", "null"]

    AboutUpdate:
      type: object
      properties:
        headline:
          type: string
        headlineRu:
          type: ["string", "null"]
        headlineTj:
          type: ["string", "null"]
        body:
          type: string
        bodyRu:
          type: ["string", "null"]
        bodyTj:
          type: ["string", "null"]
        mission:
          type: ["string", "null"]
        missionRu:
          type: ["string", "null"]
        missionTj:
          type: ["string", "null"]
        founded:
          type: ["string", "null"]

    Contacts:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        telegram:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        youtube:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]

    ContactsUpdate:
      type: object
      properties:
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        telegram:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        youtube:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]

    Service:
      type: object
      required: [id, title, mediaUrl, mediaType, isActive, sortOrder, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        subtitle:
          type: ["string", "null"]
        subtitleRu:
          type: ["string", "null"]
        subtitleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        mediaUrl:
          type: string
        mediaType:
          type: string
        linkUrl:
          type: ["string", "null"]
        linkLabel:
          type: ["string", "null"]
        linkLabelRu:
          type: ["string", "null"]
        linkLabelTj:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string

    ServiceInput:
      type: object
      required: [title, mediaUrl, mediaType]
      properties:
        title:
          type: string
          minLength: 1
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        subtitle:
          type: ["string", "null"]
        subtitleRu:
          type: ["string", "null"]
        subtitleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        mediaUrl:
          type: string
        mediaType:
          type: string
        linkUrl:
          type: ["string", "null"]
        linkLabel:
          type: ["string", "null"]
        linkLabelRu:
          type: ["string", "null"]
        linkLabelTj:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer

    ServiceUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        subtitle:
          type: ["string", "null"]
        subtitleRu:
          type: ["string", "null"]
        subtitleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        mediaUrl:
          type: string
        mediaType:
          type: string
        linkUrl:
          type: ["string", "null"]
        linkLabel:
          type: ["string", "null"]
        linkLabelRu:
          type: ["string", "null"]
        linkLabelTj:
          type: ["string", "null"]
        isActive:
          type: boolean
        sortOrder:
          type: integer

    Partner:
      type: object
      required: [id, name, logoUrl, sortOrder, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        logoUrl:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string

    PartnerInput:
      type: object
      required: [name, logoUrl]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        logoUrl:
          type: string
        sortOrder:
          type: integer

    PartnerUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        logoUrl:
          type: string
        sortOrder:
          type: integer

    Category:
      type: object
      required: [id, slug, name, sortOrder, createdAt]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        nameRu:
          type: ["string", "null"]
