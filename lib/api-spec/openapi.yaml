openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Tasvirnigor Film & Animation Studio API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: projects
  - name: team
  - name: content
  - name: admin
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all portfolio projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized

  /projects/{id}:
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List all team members
      responses:
        "200":
          description: List of team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Create a team member (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized

  /team/{id}:
    patch:
      operationId: updateTeamMember
      tags: [team]
      summary: Update a team member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteTeamMember
      tags: [team]
      summary: Delete a team member (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /about:
    get:
      operationId: getAbout
      tags: [content]
      summary: Get about section content
      responses:
        "200":
          description: About content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"
    patch:
      operationId: updateAbout
      tags: [content]
      summary: Update about section (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AboutUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/About"
        "401":
          description: Unauthorized

  /contacts:
    get:
      operationId: getContacts
      tags: [content]
      summary: Get contacts information
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contacts"
    patch:
      operationId: updateContacts
      tags: [content]
      summary: Update contacts (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contacts"
        "401":
          description: Unauthorized

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "204":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Check admin session status
      responses:
        "200":
          description: Admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not authenticated

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Project:
      type: object
      required: [id, title, youtubeUrl, bannerUrl, sortOrder, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        youtubeUrl:
          type: string
        bannerUrl:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string

    ProjectInput:
      type: object
      required: [title, youtubeUrl, bannerUrl]
      properties:
        title:
          type: string
          minLength: 1
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        youtubeUrl:
          type: string
        bannerUrl:
          type: string
        sortOrder:
          type: integer

    ProjectUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        titleRu:
          type: ["string", "null"]
        titleTj:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        descriptionRu:
          type: ["string", "null"]
        descriptionTj:
          type: ["string", "null"]
        youtubeUrl:
          type: string
        bannerUrl:
          type: string
        sortOrder:
          type: integer

    TeamMember:
      type: object
      required: [id, name, position, photoUrl, sortOrder, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        position:
          type: string
        positionRu:
          type: ["string", "null"]
        positionTj:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        bioRu:
          type: ["string", "null"]
        bioTj:
          type: ["string", "null"]
        photoUrl:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string

    TeamMemberInput:
      type: object
      required: [name, position, photoUrl]
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: string
          minLength: 1
        positionRu:
          type: ["string", "null"]
        positionTj:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        bioRu:
          type: ["string", "null"]
        bioTj:
          type: ["string", "null"]
        photoUrl:
          type: string
        sortOrder:
          type: integer

    TeamMemberUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        position:
          type: string
          minLength: 1
        positionRu:
          type: ["string", "null"]
        positionTj:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        bioRu:
          type: ["string", "null"]
        bioTj:
          type: ["string", "null"]
        photoUrl:
          type: string
        sortOrder:
          type: integer

    About:
      type: object
      required: [id, headline, body]
      properties:
        id:
          type: integer
        headline:
          type: string
        headlineRu:
          type: ["string", "null"]
        headlineTj:
          type: ["string", "null"]
        body:
          type: string
        bodyRu:
          type: ["string", "null"]
        bodyTj:
          type: ["string", "null"]
        mission:
          type: ["string", "null"]
        missionRu:
          type: ["string", "null"]
        missionTj:
          type: ["string", "null"]
        founded:
          type: ["string", "null"]

    AboutUpdate:
      type: object
      properties:
        headline:
          type: string
        headlineRu:
          type: ["string", "null"]
        headlineTj:
          type: ["string", "null"]
        body:
          type: string
        bodyRu:
          type: ["string", "null"]
        bodyTj:
          type: ["string", "null"]
        mission:
          type: ["string", "null"]
        missionRu:
          type: ["string", "null"]
        missionTj:
          type: ["string", "null"]
        founded:
          type: ["string", "null"]

    Contacts:
      type: object
      required: [id]
      properties:
        id:
          type: integer
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        telegram:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        youtube:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]

    ContactsUpdate:
      type: object
      properties:
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        telegram:
          type: ["string", "null"]
        instagram:
          type: ["string", "null"]
        youtube:
          type: ["string", "null"]
        facebook:
          type: ["string", "null"]

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
