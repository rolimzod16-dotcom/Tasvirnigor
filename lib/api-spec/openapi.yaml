    CategoryInput:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        nameRu:
          type: ["string", "null"]
        nameTj:
          type: ["string", "null"]
        sortOrder:
          type: integer

    CategoryUpdate:
      type: object
      properties:
        slug:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        nameRu:
          type: ["string", "null"]
        nameTj:
          type: ["string", "null"]
        sortOrder:
          type: integer

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminSession:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
